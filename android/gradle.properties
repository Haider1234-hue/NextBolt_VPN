org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Selects which native billing backend flutter_inapp_purchase links against:
#   true  -> openiap-google-amazon (Amazon Appstore IAP)  — Fire OS / Amazon builds
#   false -> openiap-google (Google Play Billing)         — Google Play builds
# Fire OS has no Play Services, so Play Billing cannot initialize there; leaving
# this false is what made Amazon review fail with a purchase error.
# MUST be flipped back to false before building the Play Store AAB.
fireOsEnabled=false
